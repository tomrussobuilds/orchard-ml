name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build image
        run: docker build -f docker/Dockerfile -t orchard-ml:ci .
