repos:
  - repo: local
    # Every hook is `language: system`, so it resolves through PATH.  Entries are
    # pinned to .venv/bin because a commit made without the venv activated (the
    # IDE source-control panel, a bare terminal) either fails to find the tool or
    # -- worse -- silently picks up an unrelated copy from ~/.local or anaconda.
    hooks:
      - id: black
        name: black (formatting)
        language: system
        entry: .venv/bin/black --check --quiet
        types: [python]

      - id: ruff
        name: ruff (linting + import sorting)
        language: system
        entry: .venv/bin/ruff check --fix
        types: [python]

      - id: mypy
        name: mypy --strict (type checking)
        language: system
        entry: .venv/bin/mypy --strict --cache-dir /dev/null
        types: [python]
        pass_filenames: false
        args: [orchard/, tests/]

      - id: bandit
        name: bandit (security scan)
        language: system
        entry: .venv/bin/bandit -c pyproject.toml -r
        types: [python]

      - id: test-coverage
        name: test suite + 100% coverage
        language: system
        entry: .venv/bin/pytest tests/ --cov=orchard --cov-fail-under=100 -x -q --tb=short --no-header
        pass_filenames: false
        always_run: true

      - id: mutmut-ratchet
        name: mutation score ratchet
        language: system
        entry: .venv/bin/python scripts/check_mutmut_registry.py --ratchet
        files: 'mutmut-registry\.yaml'
        pass_filenames: false

      - id: no-env-files
        name: block .env files
        language: fail
        entry: ".env files must not be committed"
        files: '\.env($|\.)'

      - id: nbstripout
        name: strip notebook outputs
        language: system
        entry: .venv/bin/python scripts/strip_notebook_outputs.py
        types: [jupyter]

      - id: git-cliff
        name: generate changelog
        language: system
        entry: bash scripts/update-changelog.sh
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: pre-push-quality-gate
        name: pre-push quality gate
        language: system
        entry: bash -c '.venv/bin/ruff check orchard/ tests/ && .venv/bin/bandit -c pyproject.toml -r orchard/ && .venv/bin/mypy --strict orchard/ tests/'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
